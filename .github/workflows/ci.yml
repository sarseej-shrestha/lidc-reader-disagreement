name: Synthetic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: .cache/matplotlib
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.5'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip check
      - name: Compile tracked Python files
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Check dependency imports
        run: python -c "import src.pylidc_compat; import matplotlib; import pylidc"
      - name: Run complete synthetic suite
        run: python tests/run_tests.py
      - name: Run synthetic review-interface smoke test
        run: python scripts/pilot_ui_smoke.py
